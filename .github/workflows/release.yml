name: release

# 打 v* 标签时构建并发布到 PyPI。
# 用的是 Trusted Publishing（OIDC），不需要在仓库里存 API Token：
#   PyPI → 项目 → Publishing → 添加 GitHub 发布者
#   owner=CodeTeng  repo=git-annals  workflow=release.yml  environment=pypi
#
# 也支持手动重跑（workflow_dispatch）：PyPI 的 trusted publisher 没配好时，
# 配完直接重跑这个工作流即可，不用重新打标签。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # 发布前必须绿。没人想在 PyPI 上留下一个测试没过的版本。
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: 校验产物
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # 两个条件：真的发上 PyPI 了，而且确实是由标签触发的。
    # 手动重跑没有标签上下文，硬建 Release 会挂 —— 那种情况只补发 PyPI。
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
