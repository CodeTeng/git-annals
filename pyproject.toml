[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-chronicle"
version = "0.1.0"
description = "Git 仓库时光机：把一段提交历史变成一份能看的演进报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chronicle = "chronicle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
